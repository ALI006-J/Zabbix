zabbix_export:
  version: '8.0'
  template_groups:
    - uuid: f7de4e20ac2d47c4ae7752da92a735db
      name: 'Templates/Network devices'
  templates:
    - uuid: e7260b4edd45498ebd2f3fa7dd2dc5b0
      template: Sophos_XGS3300_SNMPv3_Complete
      name: 'Sophos XGS 3300 SNMPv3 Complete'
      description: 'Complete starter monitoring for Sophos XGS 3300 using SNMPv3. Port1-Port8 indexes 12-19 are based on verified SNMP walk and Sophos API interface inventory. Verified names: Port1, SIP-TRunk, Radio-Shanet1-Port3, Radio-Shanet2-Port4, F1_Port5, RadioTCI1_Port6, RadioTCI2_Port7, Mikrotik. Traffic is bps derived from Counter64 octets.'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 5436303db4994adba3fd89a84260e20d
          name: 'CPU core 1 utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.25.3.3.1.2.196608
          key: sophos.cpu.core1
          history: 7d
          value_type: FLOAT
          units: '%'
        - uuid: 6b202e04b948402287ee53ef8a4a8b2a
