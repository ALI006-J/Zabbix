    - uuid: f7de4e20-ac2d-47c4-ae77-52da92a735db
      name: 'Templates/Network devices'
  templates:
    - uuid: e7260b4e-dd45-498e-bd2f-3fa7dd2dc5b0
      template: Sophos_XGS3300_SNMPv3_Complete
      name: 'Sophos XGS 3300 SNMPv3 Complete'
      description: 'Complete starter monitoring for Sophos XGS 3300 using SNMPv3. Port1-Port8 indexes 12-19 are based on verified SNMP walk and Sophos API interface inventory. Verified names: Port1, SIP-TRunk, Radio-Shanet1-Port3, Radio-Shanet2-Port4, F1_Port5, RadioTCI1_Port6, RadioTCI2_Port7, Mikrotik. Traffic is bps derived from Counter64 octets.'
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: b3c8a9ac-9f94-4fd3-9e37-bebc70978401
          name: 'Interface IP tables — dynamic source'
          type: SNMP_AGENT
          snmp_oid: 'walk[1.3.6.1.2.1.4.20.1.2]'
          key: sophos.ip.tables.raw
          delay: 5m
          history: 1d
          value_type: TEXT
        - uuid: a7b9acf5-7708-44a1-b477-94b0b4a8191f
          name: 'Port1 — LAN: IP address'
          type: DEPENDENT
          key: sophos.port1.ip
          history: 7d
          value_type: CHAR
          master_item:
            key: sophos.ip.tables.raw
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                    var lines = value.split(/\r?\n/);
                    var ips = [];
                    for (var i = 0; i < lines.length; i++) {
                        var m = lines[i].match(/^\.?1\.3\.6\.1\.2\.1\.4\.20\.1\.2\.(\d+\.\d+\.\d+\.\d+)\s*=\s*INTEGER:\s*(\d+)\s*$/);
                        if (m && Number(m[2]) === 12 && ips.indexOf(m[1]) === -1) ips.push(m[1]);
                    }
                    return ips.length ? ips.join(" / ") : "No IP data";
