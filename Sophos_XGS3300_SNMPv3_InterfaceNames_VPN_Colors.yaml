      discovery_rules:
        - uuid: da29b229-42ba-4c6b-a2bb-7821068dec67
          name: 'Sophos VPN tunnel discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#VPNNAME},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.2,{#VPNSTATUS},1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9]'
          key: sophos.vpn.discovery
          delay: 5m
          item_prototypes:
            - uuid: d2e9ebea-1b1e-4775-8b1e-1a7c36f9f722
              name: 'VPN {#VPNNAME}: activation status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.10.{#SNMPINDEX}'
              key: 'sophos.vpn.activated[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
            - uuid: 988cc0fb-a334-4ea5-93ea-c42faf040aff
              name: 'VPN {#VPNNAME}: active tunnel count'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.8.{#SNMPINDEX}'
              key: 'sophos.vpn.active_tunnels[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              units: tunnels
            - uuid: 748bd344-4487-4ffc-9bc2-3ffa0b07f65c
              name: 'VPN {#VPNNAME}: description'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.3.{#SNMPINDEX}'
              key: 'sophos.vpn.description[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              value_type: CHAR
            - uuid: 5ab55183-78e2-416d-8078-9dede9e291cb
              name: 'VPN {#VPNNAME}: local gateway port'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.7.{#SNMPINDEX}'
              key: 'sophos.vpn.gateway[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              value_type: CHAR
            - uuid: 65959083-def1-44ee-be1f-86385577f479
              name: 'VPN {#VPNNAME}: mode'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.5.{#SNMPINDEX}'
              key: 'sophos.vpn.mode[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              value_type: CHAR
            - uuid: bd14dbb5-e6ac-4a0a-a650-96a70eaa8f61
              name: 'VPN {#VPNNAME}: tunnel name'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.2.{#SNMPINDEX}'
              key: 'sophos.vpn.name[{#SNMPINDEX}]'
              delay: 1h
              history: 7d
              value_type: CHAR
            - uuid: 4f426c3f-e1c3-4376-84fe-6c6dc1f101a8
              name: 'VPN {#VPNNAME}: policy'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.4.{#SNMPINDEX}'
              key: 'sophos.vpn.policy[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
              value_type: CHAR
            - uuid: dbe8b2a4-af6b-4f98-a8bf-3b82cd5cf6e8
              name: 'VPN {#VPNNAME}: status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.9.{#SNMPINDEX}'
              key: 'sophos.vpn.status[{#SNMPINDEX}]'
              history: 7d
              trigger_prototypes:
                - uuid: a3a0dd64-20b1-4d71-bf5b-f1806f48b944
                  expression: 'min(/Sophos_XGS3300_SNMPv3_Complete/sophos.vpn.status[{#SNMPINDEX}],3m)=0'
                  name: 'VPN {#VPNNAME}: tunnel inactive for 3 minutes'
                  priority: HIGH
                  description: 'MIB enum: 0=inactive, 1=active, 2=partially-active. Confirm actual behavior during post-import test.'
                - uuid: edfbe42f-a406-4612-aa42-8b7a4dc3ae81
                  expression: 'last(/Sophos_XGS3300_SNMPv3_Complete/sophos.vpn.status[{#SNMPINDEX}])=2'
                  name: 'VPN {#VPNNAME}: tunnel partially active'
                  priority: WARNING
                  description: 'VPN status 2 means partially-active.'
            - uuid: 505c88bf-6088-4dc8-ad90-6ac309f1a712
              name: 'VPN {#VPNNAME}: type'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.2604.5.1.6.1.1.1.1.6.{#SNMPINDEX}'
              key: 'sophos.vpn.type[{#SNMPINDEX}]'
              delay: 5m
              history: 7d
